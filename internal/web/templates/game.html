{{define "head"}}
<link rel="stylesheet" href="/static/board.css">
{{end}}

{{define "content"}}
<div class="game-container">
    <div class="game-info">
        <div class="disc-circles">
            <div class="disc-circle black"><span id="black-score">2</span></div>
            <div class="disc-separator">-</div>
            <div class="disc-circle white"><span id="white-score">2</span></div>
        </div>
        <div class="game-status" id="game-status">Black has 4 moves</div>
    </div>
    <div class="board-container">
        <div class="board" id="board"></div>
    </div>
    <div class="button-container">
        <button id="new-game-button" class="game-button">New Game</button>
        <button id="undo-button" class="game-button">Undo</button>
        <button id="eval-mode-button" class="game-button active">Hide evals</button>
    </div>
</div>
<script src="/static/board.js"></script>
{{end}}
