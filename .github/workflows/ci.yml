name: Lint and test

on: [push, pull_request]

env:
  GO_VERSION: "1.25"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Check gofmt
        run: test -z "$(gofmt -l .)"

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: ./cmd/... ./internal/...

  js-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run JS tests
        run: node static/test/run.js

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Check cargo fmt
        run: cargo fmt --manifest-path wasm/edax-eval/Cargo.toml -- --check
      - name: Run clippy
        run: cargo clippy --manifest-path wasm/edax-eval/Cargo.toml -- -Dwarnings
      - name: Run tests
        # --release: see test.sh's comment on the same flag.
        run: cargo test --manifest-path wasm/edax-eval/Cargo.toml --release
      - name: Build wasm32 lib
        # --lib: the extract_weights bin tool is a native-only offline tool (needs flate2, which
        # is scoped out of wasm32 builds -- see Cargo.toml) and was never meant to target wasm32.
        run: cargo build --manifest-path wasm/edax-eval/Cargo.toml --target wasm32-unknown-unknown --lib --release

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: flippy_test
          POSTGRES_USER: flippy_test
          POSTGRES_PASSWORD: flippy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FLIPPY_POSTGRES_URL: "postgres://flippy_test:flippy_test@localhost:5432/flippy_test?sslmode=disable"
      FLIPPY_REDIS_URL: "redis://localhost:6379/0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install migrate
        run: go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@latest
      - name: Run migrations
        run: migrate -path migrations -database "$FLIPPY_POSTGRES_URL" up
      - name: Run tests
        run: go test -p 1 -cover ./...
