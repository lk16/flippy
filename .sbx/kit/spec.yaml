schemaVersion: "2"
kind: mixin
name: project-network-policy
displayName: Project minimal network policy
description: Minimal Anthropic API access + Docker Hub pulls for flippy's test.sh (personal-claude profile)

caps:
  network:
    allow:
      - api.anthropic.com:443            # personal-claude's actual API calls (not auto-included by the claude kit)
      - download.docker.com:443          # base image's own background `apt-get update` at boot; leave blocked and it just retries
      - registry-1.docker.io:443         # Docker Hub image pulls (postgres:17, redis:8 via docker-compose.test.yml)
      - auth.docker.io:443               # Docker Hub auth token exchange
      - production.cloudfront.docker.com:443   # Docker Hub blob CDN (NOT "cloudflare" -- easy typo)
      - archive.ubuntu.com:443           # apt install of gcc/libc6-dev below (C toolchain for wasm/edax-eval native builds)
      - security.ubuntu.com:443

commands:
  startup:
    - command: ["sudo", "rm", "-f", "/usr/local/bin/clipboard-bridge", "/usr/local/bin/sbx-clipboard"]
      description: Remove the clipboard bridge binaries (no documented off-switch exists)
    # Docker-socket lockdown and passwordless-sudo removal are deliberately
    # NOT applied here: test.sh needs a working `docker compose` with normal
    # nested-Docker root access inside the VM (see sbx setup guide, "Docker
    # Compose" section) -- locking those down breaks that without adding
    # meaningful extra containment.
    - command: ["sh", "-c", "sudo sed -i 's|http://archive.ubuntu.com|https://archive.ubuntu.com|; s|http://security.ubuntu.com|https://security.ubuntu.com|' /etc/apt/sources.list.d/ubuntu.sources; for i in $(seq 1 30); do sudo apt-get update -qq && break; sleep 1; done && sudo apt-get install -y -qq gcc libc6-dev"]
      description: >-
        Install a C toolchain (retry loop past the base image's own async
        apt-get update holding the lock) so cargo build/test can link the
        native target -- see docs/sandbox.md's "no C compiler/linker" gap.
        The sed first: the allowlist above covers :443 only, while the base
        image's sources default to http://, so without it every apt-get here
        403s and the install silently leaves the sandbox with no gcc.
