services:
  postgres-test:
    image: postgres:17
    ports:
      - "12322:5432"
    environment:
      POSTGRES_USER: flippy_test
      POSTGRES_PASSWORD: flippy_test
      POSTGRES_DB: flippy_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flippy_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-test:
    image: redis:8
    ports:
      - "12324:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
